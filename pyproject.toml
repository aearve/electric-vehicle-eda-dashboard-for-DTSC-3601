[project]
name = "streamlit-eda-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "kagglehub>=1.0.2",
    "matplotlib>=3.11.1",
    "modal>=1.5.5",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.3",
    "seaborn>=0.13.2",
    "streamlit>=1.62.0",
    "supabase>=2.31.0",
]

[project.scripts]
streamlit-eda-project = "streamlit_eda_project:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
